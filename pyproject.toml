[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tor-audit"
version = "1.0.0"
description = "Autonomous Sovereign RAG Engine for Enterprise Terms of Reference (TOR) Auditing, SLA Extraction, and Deterministic Liquidated Damages Calculation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Attidmese Bunsua"}
]
keywords = [
    "procurement",
    "tor",
    "terms-of-reference",
    "contract-risk",
    "liquidated-damages",
    "sla",
    "rag",
    "sqlite-fts5",
    "audit",
    "ptt-group",
    "egp"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0.0"]
test = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/Zeydsuno/tor-audit"
Repository = "https://github.com/Zeydsuno/tor-audit"
"Issue Tracker" = "https://github.com/Zeydsuno/tor-audit/issues"
